privilegeTargets:
  'Neos\Flow\Security\Authorization\Privilege\Method\MethodPrivilege':
    # The docs are public, calling the API requires logging in
    "Neos.Api.Docs:Docs":
      matcher: 'method(Neos\Api\Docs\Controller\DocsController->(index|oauth2Redirect)Action())'

roles:
  "Neos.Flow:Everybody":
    privileges:
      - privilegeTarget: "Neos.Api.Docs:Docs"
        permission: GRANT
